<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nghịch Hỏa Tinh Đồ</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tooltips.css">
    <style>
        #nav-sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 70px; background: #0a0e1a; padding-top: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; border-right: 1px solid #2a3a5a; z-index: 100; }
        .nav-btn { background: none; border: none; color: #8899b0; cursor: pointer; text-align: center; font-size: 11px; padding: 10px 0; width: 100%; transition: all 0.2s; }
        .nav-btn.active { color: #e8d5a3; background: #1a2540; }
        #main-content { margin-left: 70px; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: #111827; margin: 10% auto; padding: 20px; border: 1px solid #7ad8a0; width: 90%; max-width: 600px; border-radius: 12px; }
        @media(max-width: 480px) { #main-content { margin-left: 50px; } #nav-sidebar { width: 50px; } }
    </style>
</head>
<body class="game-main-bg">

<!-- Sidebar Navigation -->
<nav id="nav-sidebar">
    <button class="nav-btn active" data-tab="cultivate">🧘<br>Tu</button>
    <button class="nav-btn" data-tab="adventure">🗺️<br>Phiêu</button>
    <button class="nav-btn" data-tab="skills">📜<br>Kỹ</button>
    <button class="nav-btn" data-tab="alchemy">💊<br>Đan</button>
    <button class="nav-btn" data-tab="cave">🏔️<br>Động</button>
    <button class="nav-btn" data-tab="quests">📋<br>NV</button>
    <button class="nav-btn" onclick="toggleInventory()">🎒<br>Kho</button>
</nav>

<div id="main-content">
    <div class="header">
        <div class="header-top">
            <div class="header-title">☯ Nghịch Hỏa Tinh Đồ <span>— bản tu tiên</span></div>
            <div class="currencies" id="currencyDisplay">
                <div class="currency stone"><span class="icon">💎</span> Linh Thạch: <span class="val" id="spiritStones">0</span></div>
                <div class="currency jade"><span class="icon">🔮</span> Tiên Ngọc: <span class="val" id="jade">0</span></div>
            </div>
        </div>
    </div>
    <div class="container">
        <!-- Original content (Panels) -->
        <div class="realm-display">...</div>
        <div id="panel-cultivate" class="panel active">...</div>
        <div id="panel-adventure" class="panel">...</div>
        <div id="panel-skills" class="panel">...</div>
        <div id="panel-alchemy" class="panel">...</div>
        <div id="panel-cave" class="panel">...</div>
        <div id="panel-quests" class="panel">...</div>
    </div>
</div>

<!-- Inventory Modal -->
<div id="inventory-modal" class="modal">
    <div class="modal-content">
        <span onclick="toggleInventory()" style="float:right; cursor:pointer;">✖</span>
        <div id="inventoryPanel">...Content...</div>
    </div>
</div>

<script>
    // Logic to switch panels based on sidebar clicks
    document.querySelectorAll('.nav-btn[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panel-' + btn.getAttribute('data-tab')).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });
    function toggleInventory() {
        const modal = document.getElementById('inventory-modal');
        modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
    }
</script>
</body>
</html>
