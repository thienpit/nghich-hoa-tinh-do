<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nghịch Hỏa Tinh Đồ</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tooltips.css">
</head>
<body class="game-main-bg">

<div id="nav-sidebar">
  <div class="nav-item active" onclick="showPanel('cultivate')">🧘<br>Tu</div>
  <div class="nav-item" onclick="showPanel('adventure')">🗺️<br>Phiêu</div>
  <div class="nav-item" onclick="showPanel('skills')">📜<br>Kỹ</div>
  <div class="nav-item" onclick="showPanel('alchemy')">💊<br>Đan</div>
  <div class="nav-item" onclick="showPanel('cave')">🏔️<br>Động</div>
  <div class="nav-item" onclick="showPanel('quests')">📋<br>NV</div>
  <div class="nav-item" onclick="toggleInventory()">🎒<br>Kho</div>
</div>

<div id="main-content">
  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div class="header-title">☯ Nghịch Hỏa Tinh Đồ</div>
      <div class="currencies" id="currencyDisplay">
        <div class="currency stone">💎 <span class="val" id="spiritStones">0</span></div>
        <div class="currency jade">🔮 <span class="val" id="jade">0</span></div>
      </div>
    </div>
  </div>

  <!-- Panels -->
  <div id="panel-cultivate" class="panel active">
    <!-- Re-insert original cultivation panel content here -->
    <div class="realm-display">...</div>
    <div class="card">...</div>
  </div>
  <div id="panel-adventure" class="panel">...</div>
  <div id="panel-skills" class="panel">...</div>
  <div id="panel-alchemy" class="panel">...</div>
  <div id="panel-cave" class="panel">...</div>
  <div id="panel-quests" class="panel">...</div>
</div>

<div id="inventory-modal">
  <div class="card-title">🎒 Kho đồ</div>
  <div id="inventoryGrid"></div>
  <button class="btn btn-sm" onclick="toggleInventory()">Đóng</button>
</div>

<script>
// Keep existing scripts and re-attach UI logic
function showPanel(tabId) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tabId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  event.currentTarget.classList.add('active');
}
function toggleInventory() {
  const modal = document.getElementById('inventory-modal');
  modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
}
</script>
</body>
</html>
